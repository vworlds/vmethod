name: CI
on:
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require PR changelog fragment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/changelog.mjs "$PR_NUMBER"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 5
      - run: npm run build
      - run: npm run knip
      - run: npm run smoke
