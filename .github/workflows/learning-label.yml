name: Learning label
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Temporary backward-compatibility fix, owner decision 2026-10-27 (#309):
      # GitHub never advances pull_request.base.sha while a learning PR stays
      # open, so the job kept running stale CLI code under this current workflow
      # file; #247 failed exactly that way with the pre-#285 token-variable
      # error. Check out the base branch tip instead, so the workflow file and
      # the code it runs always match. It still never checks out PR head code.
      # Remove this workaround and restore pull_request.base.sha by 2026-11-26.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate metadata and label authorized submissions
        env:
          TOKEN: ${{ github.token }}
          VMETHOD_ROLE: orchestrator
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # vmethod reads GitHub credentials only from the gh login in GH_CONFIG_DIR.
        run: |
          export GH_CONFIG_DIR="$RUNNER_TEMP/gh"
          mkdir -p "$GH_CONFIG_DIR"
          printf 'github.com:\n    oauth_token: %s\n' "$TOKEN" > "$GH_CONFIG_DIR/hosts.yml"
          node dist/vmethod.mjs learnings check-pr "$PR_NUMBER" --label
