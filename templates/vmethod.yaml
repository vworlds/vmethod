# Example only: replace identity, paths, recipes and env names before use.
repo: example/project
org: example
baseBranch: dev
releaseBranch: master
# The workers' own clone of the repository, relative to this checkout or absolute;
# VMETHOD_WORKER_CHECKOUT overrides it per machine. Worker sessions run in worktrees
# of it, with the worker identity from its .claude/settings.local.json.
workerCheckout: ../example-worker
stateName: example-state
vmethod:
  repo: vworlds/vmethod # off disables methodology subscriptions
watch:
  preview: false # opt in to short, labelled untrusted title/comment previews
branches:
  taskPattern: "<number>-<slug>"
  worktreeRoot: .worktrees
  mainCheckout: /replace/with/consumer/checkout
  packPrefix: pack/
  trackPrefix: track/
board:
  enabled: true
  owner: example
  number: 1
  repos: [example/project]
learningsPrivacy: public
# Override push.denyPatterns only when the built-in artefact policy needs changing.
push: {}
checks:
  verify: [npm run test]
  release: [npm run build]
  docsGlob: "docs/**/*.md"
  ci: [check]
postMerge:
  install: npm ci
  trigger: package-lock.json
merge:
  requireCurrentBase: true
changelog:
  directory: changes/unreleased
  kinds: [breaking, feature, fix]
# GitHub access comes from the gh login in GH_CONFIG_DIR. sshKey optionally names an
# environment variable holding a private key path, for SSH fetch/push when HTTPS fails.
credentials:
  sshKey: EXAMPLE_SSH_KEY
